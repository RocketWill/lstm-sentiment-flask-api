<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Chinese LSTM sentiment inference pipeline</title>
  <desc id="desc">Chinese text is segmented with jieba, mapped through a Word2Vec vocabulary, padded to 100 tokens, passed through embedding and LSTM layers, and converted to positive sentiment probability.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8e8"/>
      <stop offset="1" stop-color="#8b4df5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#26324a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7b86a0"/>
    </marker>
    <style>
      .text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .step { font-size: 17px; font-weight: 700; }
      .detail { font-size: 13px; fill: #68738b; }
      .arrow { stroke: #7b86a0; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="300" rx="26" fill="#fbfcff"/>
  <circle cx="1120" cy="20" r="150" fill="#f4efff"/>
  <path d="M0 0h290L210 300H0z" fill="#f5f8fe"/>

  <g filter="url(#shadow)">
    <rect x="45" y="88" width="150" height="124" rx="18" fill="#fff" stroke="#dbe2ef" stroke-width="2"/>
    <rect x="45" y="88" width="150" height="7" rx="3.5" fill="url(#accent)"/>
    <text class="text step" x="120" y="137" text-anchor="middle">Chinese text</text>
    <text class="text detail" x="120" y="166" text-anchor="middle">Input sentence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="235" y="88" width="150" height="124" rx="18" fill="#fff" stroke="#dbe2ef" stroke-width="2"/>
    <text class="text step" x="310" y="137" text-anchor="middle">jieba</text>
    <text class="text detail" x="310" y="166" text-anchor="middle">Word segmentation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="88" width="150" height="124" rx="18" fill="#fff" stroke="#dbe2ef" stroke-width="2"/>
    <text class="text step" x="500" y="132" text-anchor="middle">Word2Vec</text>
    <text class="text detail" x="500" y="158" text-anchor="middle">Vocabulary index</text>
    <text class="text detail" x="500" y="180" text-anchor="middle">mapping</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="615" y="88" width="150" height="124" rx="18" fill="#fff" stroke="#dbe2ef" stroke-width="2"/>
    <text class="text step" x="690" y="132" text-anchor="middle">Sequence</text>
    <text class="text detail" x="690" y="158" text-anchor="middle">Pad or truncate</text>
    <text class="text detail" x="690" y="180" text-anchor="middle">to 100 tokens</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="88" width="150" height="124" rx="18" fill="#fff" stroke="#cfc3ef" stroke-width="2"/>
    <text class="text step" x="880" y="132" text-anchor="middle">Embedding</text>
    <text class="text detail" x="880" y="158" text-anchor="middle">100 dimensions</text>
    <text class="text detail" x="880" y="180" text-anchor="middle">LSTM · 50 units</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="995" y="76" width="160" height="148" rx="20" fill="#292e3e"/>
    <text x="1075" y="126" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fff">Sigmoid score</text>
    <text x="1075" y="158" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#fff">0 – 1</text>
    <text x="1075" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b5bfd2">Positive probability</text>
  </g>

  <path class="arrow" d="M195 150H225"/>
  <path class="arrow" d="M385 150H415"/>
  <path class="arrow" d="M575 150H605"/>
  <path class="arrow" d="M765 150H795"/>
  <path class="arrow" d="M955 150H985"/>
</svg>
